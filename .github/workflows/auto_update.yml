name: 股票池自动更新

# 云端独立运行，每次从零重建：清空旧库 → 程序从公开接口抓取建库 → 评分出页面
# → 提交回 main 触发 Pages 更新。全程不依赖本地机器、种子库或跨 run 缓存。
# cron 的 1-5 已排除周末；工作日遇法定节假日休市由建库脚本判定后跳过。

on:
  # A股收盘后（北京时间 16:30 = UTC 08:30），周一到周五
  schedule:
    - cron: '30 8 * * 1-5'
  # 手动触发：可勾选 force 强制重建（绕过周末休市判定，用于补建页面）
  workflow_dispatch:
    inputs:
      force:
        description: '强制重建（跳过周末休市判定）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: stockpool-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 清空旧库 → 程序从零抓取建库
        id: build
        env:
          STOCKPOOL_DB: ${{ github.workspace }}/engine/data/quant_cloud.db
          STOCKPOOL_SKIP_FLAG: ${{ github.workspace }}/engine/data/skip.flag
          FORCE_BUILD: ${{ inputs.force == true && '1' || '' }}
        run: |
          set -euo pipefail
          mkdir -p engine/data cache out
          rm -f "$STOCKPOOL_SKIP_FLAG"
          cd src
          python bootstrap_cloud.py --workers 16
          if [ -f "$STOCKPOOL_SKIP_FLAG" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=休市跳过::今日休市，页面保持上一交易日数据"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成股票池页面（评分）
        if: steps.build.outputs.skipped != 'true'
        env:
          STOCKPOOL_DB: ${{ github.workspace }}/engine/data/quant_cloud.db
        run: |
          cd src
          python simple_pool.py

      - name: 复制为 index.html 供 Pages 使用
        if: steps.build.outputs.skipped != 'true'
        run: |
          cp out/简版股票池.html index.html
          test -s index.html && echo "index.html 已生成 $(wc -c < index.html) 字节"

      - name: 提交并推送
        if: steps.build.outputs.skipped != 'true'
        run: |
          git config user.name "stockpool-bot"
          git config user.email "bot@users.noreply.github.com"
          # 自定义域名：每次重建都确保 CNAME 存在，避免误删导致域名绑定丢失
          [ "$(cat CNAME 2>/dev/null)" = "4.legaga.top" ] || printf '4.legaga.top\n' > CNAME
          git add -f CNAME
          # index.html 被 .gitignore 排除，需 -f 强制纳入；Pages 只认它
          git add -f index.html
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 云端自动重建并评分 $(date -u +%Y%m%d-%H%M)"
            git push origin main
          fi
