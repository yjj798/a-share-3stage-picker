name: 股票池自动更新

# 云端独立运行：下载精简数据种子 → 抓当日增量 → 评分 → 生成页面 → 提交回仓库，
# 触发 GitHub Pages 自动更新。全程不依赖本地机器推送任何文件。
# 种子来自本仓库 Release seed-v1：K线60交易日、热度20交易日、概念/涨停原因按60交易日。
# 每次运行用东财一次请求抓全市场当日OHLC追加进种子，滚动保持窗口固定（K线60/热度20），
# 数据随交易日前进；周末/数据未前进时自动跳过增量。轻量、零第三方依赖。

on:
  # A股收盘后（北京时间 16:30 = UTC 08:30），周一到周五
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockpool-auto-update
  cancel-in-progress: false

env:
  SEED_TAG: seed-v1

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 下载真实数据种子
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "下载 seed.db.gz ..."
          gh release download "${{ env.SEED_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern 'seed.db.gz' --dir "${{ runner.temp }}"
          echo "下载 f10_concepts.json ..."
          gh release download "${{ env.SEED_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern 'f10_concepts.json' --dir cache
          gzip -dc "${{ runner.temp }}/seed.db.gz" > "${{ runner.temp }}/quant_cloud.db"
          echo "种子就绪: $(du -h "${{ runner.temp }}/quant_cloud.db" | cut -f1)"

      - name: 抓取当日增量并滚动窗口
        # 东财一次请求拿全市场当日OHLC + 公开热度榜，追加到种子库；
        # K线保持60交易日、热度保持20交易日；周末或数据未前进时自动跳过。
        env:
          STOCKPOOL_DB: ${{ runner.temp }}/quant_cloud.db
        run: |
          set -euo pipefail
          cd src
          python cloud_incremental.py

      - name: 生成股票池页面
        env:
          STOCKPOOL_DB: ${{ runner.temp }}/quant_cloud.db
        run: |
          set -euo pipefail
          cd src
          python simple_pool.py

      - name: 复制为 index.html 供 Pages 使用
        run: |
          set -euo pipefail
          cp out/简版股票池.html index.html
          test -s index.html && echo "index.html $(wc -c < index.html) 字节"

      - name: 提交并推送
        run: |
          set -euo pipefail
          git config user.name "stockpool-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f index.html
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 云端自动更新股票池页面 $(date -u +%Y%m%d-%H%M)"
            git push origin main
          fi
