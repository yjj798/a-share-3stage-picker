name: 股票池自动更新

# 云端独立运行：从公开接口自建行情库 → 重算评分 → 生成页面 → 提交回仓库，
# 触发 GitHub Pages 自动更新。全程不依赖本地机器推送任何数据。

on:
  # A股收盘后（北京时间 16:30 = UTC 08:30），周一到周五
  schedule:
    - cron: '30 8 * * 1-5'
  # 允许在 Actions 页手动触发验证
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stockpool-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 云端自建最小行情库
        # 库落到 runner 临时目录，不进版本库；纯标准库，无需 pip install
        env:
          STOCKPOOL_DB: ${{ runner.temp }}/quant_cloud.db
        run: |
          cd src
          python bootstrap_cloud.py --workers 20

      - name: 生成股票池页面
        env:
          STOCKPOOL_DB: ${{ runner.temp }}/quant_cloud.db
        run: |
          cd src
          python simple_pool.py

      - name: 复制为 index.html 供 Pages 使用
        run: |
          cp out/简版股票池.html index.html
          test -s index.html && echo "index.html 已生成 $(wc -c < index.html) 字节"

      - name: 提交并推送
        run: |
          git config user.name "stockpool-bot"
          git config user.email "bot@users.noreply.github.com"
          # index.html 被 .gitignore 排除，需 -f 强制纳入；Pages 只认它
          git add -f index.html
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "chore: 云端自动更新股票池页面 $(date -u +%Y%m%d-%H%M)"
            git push origin main
          fi
